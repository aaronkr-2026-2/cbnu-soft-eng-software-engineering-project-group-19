<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f4" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="/app/scholward-mark.svg" type="image/svg+xml" />
    <title>Parolni tiklash — SCHOLWARD Academy</title>
    <link rel="stylesheet" href="/app/style.css?v=scholward-4" />
    <link rel="stylesheet" href="/app/portal-auth.css?v=scholward-4" />
  </head>
  <body class="portal-page">
    <main class="portal-card">
      <a class="brand" href="/app/"
        ><img class="brand-mark" src="/app/scholward-mark.svg" width="32" height="32" alt="" /><span
          class="brand-name"
          >SCHOLWARD <span class="brand-academy">Academy</span></span
        ></a
      >
      <label class="portal-language"
        ><span id="languageLabel">Til</span
        ><select id="portalLanguage">
          <option value="uz">O‘zbekcha</option>
          <option value="en">English</option>
          <option value="ru">Русский</option>
          <option value="ko">한국어</option>
        </select></label
      >
      <div class="portal-eyebrow">SCHOLWARD Academy</div>
      <h1 id="title">Parolni tiklash</h1>
      <p class="portal-description" id="description">
        Hisobingizga bog‘langan email manzilini kiriting.
      </p>
      <form id="resetRequestForm" class="auth-form">
        <label
          ><span id="emailLabel">Email</span
          ><input name="email" type="email" autocomplete="email" required
        /></label>
        <button class="button button-dark auth-submit" id="requestButton" type="submit">
          Tiklash havolasini yuborish
        </button>
      </form>
      <form id="resetConfirmForm" class="auth-form" hidden>
        <div class="reset-password-field">
          <label id="passwordLabel" for="resetNewPassword">Yangi parol</label>
          <div class="reset-password-input">
            <input
              id="resetNewPassword"
              name="new_password"
              type="password"
              autocomplete="new-password"
              spellcheck="false"
              autocapitalize="off"
              minlength="8"
              maxlength="128"
              required
            />
            <button class="reset-password-toggle" type="button" aria-controls="resetNewPassword">
              Ko‘rsatish
            </button>
          </div>
        </div>
        <div class="reset-password-field">
          <label id="confirmLabel" for="resetConfirmPassword">Yangi parolni takrorlang</label>
          <div class="reset-password-input">
            <input
              id="resetConfirmPassword"
              name="confirm_password"
              type="password"
              autocomplete="new-password"
              spellcheck="false"
              autocapitalize="off"
              minlength="8"
              maxlength="128"
              required
            />
            <button
              class="reset-password-toggle"
              type="button"
              aria-controls="resetConfirmPassword"
            >
              Ko‘rsatish
            </button>
          </div>
        </div>
        <button class="button button-dark auth-submit" id="confirmButton" type="submit">
          Parolni saqlash
        </button>
      </form>
      <p class="form-message" id="resetMessage" role="status"></p>
      <a class="portal-home" href="/app/learner-login.html" id="backLink"
        >Kirish sahifasiga qaytish</a
      >
    </main>
    <script src="/app/reset-password.js?v=scholward-1" defer></script>
  </body>
</html>
