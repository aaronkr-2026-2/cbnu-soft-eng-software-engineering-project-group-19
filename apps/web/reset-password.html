<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f4" />
    <meta name="referrer" content="no-referrer" />
    <title>Parolni tiklash — StudyFlow AI</title>
    <link rel="stylesheet" href="/app/style.css" />
    <link rel="stylesheet" href="/app/portal-auth.css" />
  </head>
  <body class="portal-page">
    <main class="portal-card">
      <a class="brand" href="/app/"><span class="brand-mark">s</span><span>studyflow<span class="brand-ai">.ai</span></span></a>
      <label class="portal-language"><span id="languageLabel">Til</span><select id="portalLanguage"><option value="uz">O‘zbekcha</option><option value="en">English</option><option value="ru">Русский</option><option value="ko">한국어</option></select></label>
      <div class="portal-eyebrow">STUDYFLOW AI</div>
      <h1 id="title">Parolni tiklash</h1>
      <p class="portal-description" id="description">Hisobingizga bog‘langan email manzilini kiriting.</p>
      <form id="resetRequestForm" class="auth-form">
        <label><span id="emailLabel">Email</span><input name="email" type="email" autocomplete="email" required /></label>
        <button class="button button-dark auth-submit" id="requestButton" type="submit">Tiklash havolasini yuborish</button>
      </form>
      <form id="resetConfirmForm" class="auth-form" hidden>
        <label><span id="passwordLabel">Yangi parol</span><input name="new_password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required /></label>
        <label><span id="confirmLabel">Yangi parolni takrorlang</span><input name="confirm_password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required /></label>
        <button class="button button-dark auth-submit" id="confirmButton" type="submit">Parolni saqlash</button>
      </form>
      <p class="form-message" id="resetMessage" role="status"></p>
      <a class="portal-home" href="/app/learner-login.html" id="backLink">Kirish sahifasiga qaytish</a>
    </main>
    <script src="/app/reset-password.js" defer></script>
  </body>
</html>
