<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f4" />
    <title>StudyFlow AI — Verify certificate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/app/style.css" />
  </head>
  <body class="verify-page">
    <header class="topbar">
      <a class="brand" href="/app/" aria-label="StudyFlow AI"><span class="brand-mark">s</span><span>studyflow<span class="brand-ai">.ai</span></span></a>
      <div class="top-actions"><label class="language-picker"><span class="sr-only" data-i18n="languageLabel"></span><span aria-hidden="true">◎</span><select id="language" aria-label="Language"><option value="uz">O‘zbekcha</option><option value="en">English</option><option value="ru">Русский</option><option value="ko">한국어</option></select></label></div>
    </header>
    <main class="verify-main">
      <section class="verify-card">
        <div class="section-label"><span class="tiny-star">✳</span><span data-i18n="verifyEyebrow"></span></div>
        <h1 data-i18n="verifyTitle"></h1>
        <p class="verify-intro" data-i18n="verifyBody"></p>
        <form id="verifyForm" class="verify-form">
          <label for="certificateCode" data-i18n="certificateCodeLabel"></label>
          <input id="certificateCode" name="code" autocomplete="off" required maxlength="40" />
          <button class="button button-dark" type="submit" data-i18n="verifySubmit"></button>
        </form>
        <div id="verificationResult" class="verification-result" role="status" aria-live="polite"></div>
      </section>
    </main>
    <script src="/app/verify.js" defer></script>
  </body>
</html>
