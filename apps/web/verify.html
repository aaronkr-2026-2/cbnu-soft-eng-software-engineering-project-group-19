<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f4" />
    <link rel="icon" href="/app/scholward-crest-sage.svg" type="image/svg+xml" />
    <title>SCHOLWARD Academy — Verify certificate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css?v=scholward-20" />
    <link rel="stylesheet" href="/app/certificate.css?v=4" />
  </head>
  <body class="verify-page academy-theme">
    <header class="topbar">
      <a class="brand" href="/app/" aria-label="SCHOLWARD Academy"
        ><img
          class="brand-mark"
          src="/app/scholward-crest-sage.svg"
          width="32"
          height="32"
          alt=""
        /><span class="brand-name">SCHOLWARD <span class="brand-academy">Academy</span></span></a
      >
      <div class="top-actions">
        <label class="language-picker"
          ><span class="sr-only" data-i18n="languageLabel"></span><span aria-hidden="true">◎</span
          ><select id="language" aria-label="Language">
            <option value="uz">O‘zbekcha</option>
            <option value="en">English</option>
            <option value="ru">Русский</option>
            <option value="ko">한국어</option>
          </select></label
        >
      </div>
    </header>
    <main class="verify-main">
      <section class="verify-card">
        <div class="section-label">
          <span class="tiny-star ui-icon icon-spark" aria-hidden="true"></span
          ><span data-i18n="verifyEyebrow"></span>
        </div>
        <h1 data-i18n="verifyTitle"></h1>
        <p class="verify-intro" data-i18n="verifyBody"></p>
        <form id="verifyForm" class="verify-form">
          <label for="certificateCode" data-i18n="certificateCodeLabel"></label>
          <input id="certificateCode" name="code" autocomplete="off" required maxlength="40" />
          <button class="button button-dark" type="submit" data-i18n="verifySubmit"></button>
        </form>
        <div
          id="verificationResult"
          class="verification-result"
          role="status"
          aria-live="polite"
        ></div>
      </section>
      <div class="academy-panel-art" aria-hidden="true">
        <img src="/app/academy-lesson.webp" width="1120" height="747" alt="" />
      </div>
    </main>
    <script src="/app/preferences.js?v=1" defer></script>
    <script src="/app/certificate.js?v=6" defer></script>
    <script src="./verify.js?v=scholward-7" defer></script>
  </body>
</html>
