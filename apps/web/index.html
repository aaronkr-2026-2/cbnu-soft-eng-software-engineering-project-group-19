<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f4" />
    <link rel="icon" href="/app/scholward-crest-sage.svg" type="image/svg+xml" />
    <title>SCHOLWARD Academy — Learn at your pace</title>
    <script>
      if (location.hostname === "127.0.0.1") {
        location.replace(
          `${location.protocol}//localhost${location.port ? `:${location.port}` : ""}${location.pathname}${location.search}${location.hash}`,
        );
      } else if (["#about", "#founder"].includes(location.hash)) {
        location.replace(
          "/app/about.html" + location.search + (location.hash === "#founder" ? "#founder" : ""),
        );
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css?v=scholward-29" />
    <link rel="stylesheet" href="./media-content.css?v=5" />
    <link rel="stylesheet" href="/app/certificate.css?v=4" />
  </head>
  <body class="academy-home">
    <header class="topbar landing-topbar">
      <a class="brand" href="/app" aria-label="SCHOLWARD Academy"
        ><img
          class="brand-mark"
          src="/app/scholward-crest-sage.svg"
          width="32"
          height="32"
          alt=""
        /><span class="brand-name">SCHOLWARD <span class="brand-academy">Academy</span></span></a
      >
      <nav id="mainNav" class="nav-links" aria-label="Main navigation">
        <a href="#how" data-i18n="navHow"></a>
        <a href="#courses" data-i18n="navCourses"></a>
        <a href="/app/about.html" data-i18n="aboutTitle">Dastur haqida</a>
        <a href="verify.html" data-i18n="navVerifyCertificate"></a>
        <a id="authorPortalNav" href="/app/author-login.html" data-i18n="authorPortalNav"></a>
        <a id="learnerNav" href="#myLearning" data-i18n="learnerMenuNav" hidden></a>
        <a id="instructorNav" href="#myCourses" data-i18n="navInstructor" hidden></a>
      </nav>
      <div class="top-actions">
        <label class="language-picker"
          ><span class="sr-only" data-i18n="languageLabel"></span
          ><span class="ui-icon icon-globe" aria-hidden="true"></span
          ><select id="language" aria-label="Language">
            <option value="uz">O‘zbekcha</option>
            <option value="en">English</option>
            <option value="ru">Русский</option>
            <option value="ko">한국어</option>
          </select></label
        >
        <button class="button button-quiet" id="loginButton" data-i18n="login"></button>
        <button
          class="button button-dark button-small"
          id="signupButton"
          data-i18n="getStarted"
        ></button>
        <button
          class="button button-outline button-small"
          id="logoutButton"
          data-i18n="logout"
          hidden
        ></button>
        <button
          type="button"
          id="mobileNavToggle"
          class="mobile-nav-toggle"
          aria-expanded="false"
          aria-controls="mainNav"
        >
          <span class="ui-icon icon-menu" aria-hidden="true"></span>
          <span class="sr-only" data-i18n="menuButton">Menu</span>
        </button>
      </div>
    </header>

    <details class="browser-handoff" id="browserHandoff" hidden>
      <summary class="browser-handoff-summary">
        <span class="browser-handoff-mark" aria-hidden="true">
          <span class="browser-window-icon"><span class="ui-icon icon-arrow"></span></span>
        </span>
        <span class="browser-handoff-title" data-i18n="openInBrowser"></span>
        <span class="browser-handoff-chevron" aria-hidden="true"></span>
      </summary>
      <div class="browser-handoff-content">
        <p class="browser-handoff-help" id="browserHandoffHelp" data-i18n="browserHandoffHelp"></p>
        <div class="browser-handoff-actions">
          <a class="button button-outline button-small" id="openChrome" hidden>Chrome</a>
          <button
            class="button button-dark button-small browser-copy-button"
            id="copyBrowserLink"
            type="button"
          >
            <span class="browser-copy-icon" aria-hidden="true"></span>
            <span data-i18n="copyBrowserLink"></span>
          </button>
          <p class="browser-handoff-status" id="browserHandoffStatus" role="status"></p>
        </div>
        <input
          class="browser-handoff-url"
          id="browserHandoffUrl"
          type="url"
          aria-labelledby="browserHandoffHelp"
          readonly
          hidden
        />
      </div>
    </details>

    <main>
      <section class="hero" id="heroSection">
        <div class="hero-copy">
          <h1 data-i18n="heroTitle"></h1>
          <p class="hero-description" data-i18n="heroBody"></p>
          <div class="hero-actions">
            <button class="button button-dark" id="heroSignup" data-i18n="startLearning"></button
            ><a class="text-link" href="#courses"
              ><span data-i18n="browseCatalog"></span
              ><span class="ui-icon icon-arrow" aria-hidden="true"></span
            ></a>
          </div>
          <div class="learner-list-card resume-learning" id="resumeLearning" hidden>
            <div><b id="resumeLessonName"></b><span id="resumeCourseName"></span></div>
            <button
              class="button button-dark button-small"
              id="resumeLesson"
              type="button"
              data-i18n="resumeLearning"
            ></button>
          </div>
        </div>
        <div class="hero-visual">
          <img
            src="/app/academy-lesson.webp"
            width="1120"
            height="747"
            alt=""
            fetchpriority="high"
          />
        </div>
        <div class="hero-bottom">
          <div>
            <span class="ui-icon icon-target" aria-hidden="true"></span>
            <span data-i18n="selfPaced"></span>
          </div>
          <div>
            <span class="ui-icon icon-spark" aria-hidden="true"></span>
            <span data-i18n="personalized"></span>
          </div>
          <div>
            <span class="ui-icon icon-arrow" aria-hidden="true"></span>
            <span data-i18n="fourLanguages"></span>
          </div>
        </div>
      </section>

      <section class="intro-section" id="how">
        <div class="section-label">
          <span class="tiny-star ui-icon icon-spark" aria-hidden="true"></span
          ><span data-i18n="whyStudyflow"></span>
        </div>
        <div class="intro-grid">
          <h2 data-i18n="introTitle"></h2>
          <p data-i18n="introBody"></p>
        </div>
        <div class="feature-grid">
          <article class="feature-card">
            <span class="feature-icon feature-lime" aria-hidden="true"
              ><span class="ui-icon icon-spark"></span
            ></span>
            <h3 data-i18n="featureOneTitle"></h3>
            <p data-i18n="featureOneBody"></p>
          </article>
          <article class="feature-card">
            <span class="feature-icon feature-lilac" aria-hidden="true"
              ><span class="ui-icon icon-recommendation"></span
            ></span>
            <h3 data-i18n="featureTwoTitle"></h3>
            <p data-i18n="featureTwoBody"></p>
          </article>
          <article class="feature-card">
            <span class="feature-icon feature-peach" aria-hidden="true"
              ><span class="ui-icon icon-arrow"></span
            ></span>
            <h3 data-i18n="featureThreeTitle"></h3>
            <p data-i18n="featureThreeBody"></p>
          </article>
        </div>
      </section>

      <aside
        class="language-campaign"
        id="languageCampaign"
        aria-labelledby="languageCampaignTitle"
        hidden
      >
        <div class="language-campaign-copy">
          <h2 id="languageCampaignTitle" data-i18n="languageCampaignTitle"></h2>
          <p data-i18n="languageCampaignBody"></p>
          <div class="language-campaign-actions">
            <a
              class="button language-campaign-action"
              href="#courses"
              id="openCampaignCatalog"
              data-i18n="openCampaignCatalog"
            ></a>
            <a
              class="language-campaign-secondary"
              href="#courses"
              id="openLanguageCourses"
              data-i18n="openLanguageCourses"
            ></a>
            <a
              class="language-campaign-secondary"
              href="#courses"
              id="openItCourses"
              data-i18n="openItCourses"
            ></a>
          </div>
        </div>
        <div class="language-campaign-art" aria-hidden="true">
          <img src="./academy-campaign.webp" alt="" width="960" height="640" loading="lazy" />
        </div>
        <button class="language-campaign-close" type="button" id="dismissLanguageCampaign">
          <span aria-hidden="true">×</span>
        </button>
      </aside>

      <section class="course-section" id="courses" aria-labelledby="catalogTitle">
        <div class="catalog-heading">
          <h2 id="catalogTitle" tabindex="-1" data-i18n="exploreTitle"></h2>
          <div class="marketplace-search" role="search">
            <label class="sr-only" for="courseSearch" data-i18n="courseSearchLabel"></label>
            <input id="courseSearch" type="search" maxlength="100" />
            <button id="courseSearchButton" type="button" aria-label="Search courses">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <circle cx="10.8" cy="10.8" r="6.3"></circle>
                <path d="m15.5 15.5 4.2 4.2"></path>
              </svg>
            </button>
          </div>
        </div>
        <div class="catalog-filter" id="catalogItFilter" hidden>
          <span data-i18n="openItCourses"></span>
          <button
            class="button button-outline"
            id="clearCatalogItFilter"
            type="button"
            data-i18n="clearCatalogItFilter"
          ></button>
        </div>
        <div class="course-grid" id="courseGrid">
          <div class="course-placeholder" data-i18n="coursesHint"></div>
        </div>
      </section>
      <section class="instructor-studio" id="myCourses" hidden>
        <div class="section-heading dashboard-heading">
          <div>
            <div class="section-label">
              <span class="tiny-star ui-icon icon-spark" aria-hidden="true"></span
              ><span data-i18n="instructorEyebrow"></span>
            </div>
            <h2 data-i18n="instructorTitle"></h2>
          </div>
        </div>
        <nav class="learner-menu author-menu" aria-label="Author menu">
          <a href="#ownedCourses" id="authorCoursesMenu" data-i18n="authorCoursesMenu"></a>
          <a href="#courseCreateForm" data-i18n="createCourseButton"></a>
          <a href="#myProfile" data-i18n="profileMenu"></a>
          <a href="#courses" data-i18n="navCourses"></a>
        </nav>
        <form id="courseCreateForm" class="studio-form course-create-form">
          <label
            ><span data-i18n="courseTitleLabel"></span
            ><input name="title" minlength="3" maxlength="200" required /></label
          ><label
            ><span data-i18n="courseCategoryLabel"></span
            ><input name="category" maxlength="100" required
          /></label>
          <label
            ><span data-i18n="courseDescriptionLabel"></span
            ><textarea name="description" rows="3"></textarea>
          </label>
          <div class="studio-form-row">
            <label
              ><span data-i18n="courseLanguageLabel"></span
              ><select name="language">
                <option value="uz">O‘zbekcha</option>
                <option value="en">English</option>
                <option value="ru">Русский</option>
                <option value="ko">한국어</option>
              </select></label
            ><label
              ><span data-i18n="courseLevelLabel"></span
              ><select name="level">
                <option value="beginner" data-i18n="levelBeginner"></option>
                <option value="intermediate" data-i18n="levelIntermediate"></option>
                <option value="advanced" data-i18n="levelAdvanced"></option></select
            ></label>
          </div>
          <button class="button button-dark" type="submit" data-i18n="createCourseButton"></button>
          <p class="studio-message" id="courseCreateMessage" role="status"></p>
        </form>
        <div id="authorProfileSlot"></div>
        <div id="ownedCourses" class="owned-course-list"></div>
      </section>
      <section class="learner-dashboard" id="myLearning" hidden>
        <div class="section-heading dashboard-heading">
          <div>
            <div class="section-label">
              <span class="tiny-star ui-icon icon-spark" aria-hidden="true"></span
              ><span data-i18n="dashboardEyebrow"></span>
            </div>
            <h2 data-i18n="dashboardTitle"></h2>
          </div>
        </div>
        <nav class="learner-menu" aria-label="Learning menu">
          <a href="#enrolledCoursesSection" data-i18n="myCoursesAndLessons"></a>
          <a href="#completedCourses" data-i18n="completedCoursesMenu"></a>
          <a href="#myCertificates" data-i18n="myCertificatesMenu"></a>
          <a href="#myProfile" data-i18n="profileMenu"></a>
          <a href="#courses" data-i18n="availableCoursesMenu"></a>
        </nav>
        <section class="learner-profile learner-content-section" id="myProfile">
          <h3 data-i18n="profileTitle"></h3>
          <div class="profile-settings">
            <div class="profile-sidebar">
              <div class="profile-photo-row">
                <div class="profile-avatar-frame">
                  <img id="profileAvatar" alt="" hidden />
                  <span id="profileInitials" aria-hidden="true"></span>
                </div>
                <div class="profile-photo-controls">
                  <label class="profile-photo-action">
                    <input
                      id="profilePhotoInput"
                      class="sr-only"
                      type="file"
                      accept="image/jpeg,image/png,image/webp"
                      aria-describedby="profilePhotoHint"
                    />
                    <span class="ui-icon icon-arrow" aria-hidden="true"></span>
                    <span data-i18n="profilePhotoChoose"></span>
                  </label>
                  <small id="profilePhotoHint" data-i18n="profilePhotoHint"></small>
                  <p id="profilePhotoMessage" class="profile-feedback" role="status"></p>
                </div>
              </div>
              <div class="passkey-panel">
                <div class="passkey-heading">
                  <span class="passkey-mark ui-icon icon-target" aria-hidden="true"></span>
                  <b data-i18n="passkeyTitle"></b>
                </div>
                <p id="passkeyStatus" data-i18n="passkeyLoading"></p>
                <small data-i18n="passkeyPrivacy"></small>
                <button
                  id="registerPasskeyButton"
                  class="button button-outline"
                  type="button"
                  data-i18n="passkeyRegister"
                ></button>
              </div>
            </div>
            <form id="profileForm" class="profile-form">
              <label
                ><span data-i18n="profileNameLabel"></span
                ><input name="full_name" minlength="2" maxlength="150" required
              /></label>
              <label
                ><span data-i18n="profileAgeLabel"></span
                ><input name="age" type="number" min="5" max="120"
              /></label>
              <label class="profile-bio-field"
                ><span data-i18n="profileBioLabel"></span
                ><textarea name="bio" rows="3" maxlength="500"></textarea>
              </label>
              <div class="profile-form-actions">
                <button
                  class="button button-dark"
                  type="submit"
                  data-i18n="saveProfileButton"
                ></button>
                <p id="profileMessage" class="profile-feedback" role="status"></p>
              </div>
            </form>
          </div>
        </section>
        <div id="learningOverview" class="learning-overview" aria-live="polite"></div>
        <section class="learner-content-section" id="enrolledCoursesSection">
          <h3 tabindex="-1" data-i18n="myCoursesAndLessons"></h3>
          <div id="enrolledCourses" class="enrolled-grid"></div>
          <div id="activeCourseView" hidden>
            <button
              id="backToMyCourses"
              type="button"
              class="button button-outline button-small"
              data-i18n="backToMyCourses"
            ></button>
            <div id="activeCourse"></div>
          </div>
        </section>
        <section class="learner-content-section" id="completedCourses">
          <h3 data-i18n="completedCoursesTitle"></h3>
          <div id="completedCourseList" class="learner-collection"></div>
        </section>
        <section class="learner-content-section" id="myCertificates">
          <h3 data-i18n="myCertificatesTitle"></h3>
          <div id="myCertificateList" class="learner-collection"></div>
        </section>
        <section
          class="dashboard-panel recommendation-panel"
          aria-labelledby="recommendationHeading"
        >
          <div class="recommendation-heading">
            <span class="recommendation-mark ui-icon icon-spark" aria-hidden="true"></span>
            <div>
              <h3 id="recommendationHeading" data-i18n="recommendationsTitle"></h3>
              <p id="recommendationMode"></p>
            </div>
          </div>
          <div id="recommendationList" class="recommendation-list"></div>
        </section>
      </section>
      <section class="closing-banner" id="closingBanner">
        <div>
          <span class="banner-spark ui-icon icon-spark" aria-hidden="true"></span>
          <h2 data-i18n="closingTitle"></h2>
          <p data-i18n="closingBody"></p>
        </div>
        <button class="button button-light" id="closingSignup" data-i18n="startToday"></button>
      </section>
    </main>
    <footer>
      <div class="footer-inner">
        <a class="brand" href="/app"
          ><img
            class="brand-mark"
            src="/app/scholward-crest-sage.svg"
            width="32"
            height="32"
            alt=""
          /><span class="brand-name">SCHOLWARD <span class="brand-academy">Academy</span></span></a
        >
        <nav class="footer-links">
          <a href="#courses" data-i18n="browseCatalog"></a>
          <a href="/app/about.html" data-i18n="aboutTitle"></a>
        </nav>
        <small>© 2026 SCHOLWARD Academy</small>
      </div>
    </footer>

    <dialog id="courseDetailsDialog" class="course-details-dialog">
      <form method="dialog" class="course-details-close">
        <button id="courseDetailsClose" class="dialog-close" aria-label="Close">×</button>
      </form>
      <div id="courseDetailsBody" class="course-details-body"></div>
    </dialog>
    <dialog id="authDialog" class="auth-dialog">
      <form method="dialog"><button class="dialog-close" aria-label="Close">×</button></form>
      <div class="auth-brand">
        <img
          class="brand-mark"
          src="/app/scholward-crest-sage.svg"
          width="32"
          height="32"
          alt=""
        /><span class="brand-name">SCHOLWARD <span class="brand-academy">Academy</span></span>
      </div>
      <div class="auth-tabs">
        <button class="active" id="registerTab" data-i18n="register"></button
        ><button id="loginTab" data-i18n="login"></button>
      </div>
      <h2 id="authTitle"></h2>
      <p class="auth-subtitle" id="authSubtitle"></p>
      <form id="authForm" class="auth-form">
        <label id="nameField"
          ><span data-i18n="fullName"></span
          ><input name="full_name" autocomplete="name" minlength="2" required
        /></label>
        <label
          ><span data-i18n="email"></span
          ><input name="email" type="email" autocomplete="email" required
        /></label>
        <label
          ><span data-i18n="password"></span
          ><input
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
        /></label>
        <p class="form-message" id="formMessage" role="status"></p>
        <button class="button button-dark auth-submit" type="submit" id="authSubmit"></button>
      </form>
    </dialog>
    <dialog id="finalExamDialog" class="exam-dialog" aria-label="Final exam">
      <form method="dialog" class="exam-close-form">
        <button id="finalExamClose" class="dialog-close" aria-label="Close">×</button>
      </form>
      <div id="finalExamBody" class="final-exam-body"></div>
    </dialog>
    <script src="/app/preferences.js?v=1" defer></script>
    <script src="/app/certificate.js?v=6" defer></script>
    <script src="/app/app.js?v=scholward-31" defer></script>
  </body>
</html>
