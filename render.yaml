services:
  - type: web
    name: studyflow-ai
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: studyflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: "10000"
      - key: WEBAUTHN_RP_ID
        fromService:
          name: studyflow-ai
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: WEBAUTHN_RP_NAME
        value: StudyFlow AI
      - key: WEBAUTHN_ORIGIN
        fromService:
          name: studyflow-ai
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PUBLIC_APP_URL
        fromService:
          name: studyflow-ai
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_BASE_URL
        fromService:
          name: studyflow-ai
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: studyflow-db
    databaseName: studyflow_db
    user: studyflow
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    ipAllowList: []
